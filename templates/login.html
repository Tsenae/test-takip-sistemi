<!doctype html>
<html lang="tr" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giriş · Test Takip Dashboard</title>
  <script>
    (function () { try { var t = localStorage.getItem('tt-theme'); if (t) document.documentElement.setAttribute('data-bs-theme', t); } catch (e) {} })();
  </script>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<main class="login-page">
  <div class="card login-card">
    <div class="card-body p-4 p-md-5">
      <div class="login-logo-wrap mb-3">
        <img class="login-logo" src="{{ url_for('static', filename='img/polsan-logo.png') }}" alt="Polsan Teknoloji ve Savunma">
      </div>
      <h1 class="h4 text-center mb-1">Test Takip Dashboard</h1>
      <p class="text-center text-body-secondary small mb-4">Devam etmek için paylaşım şifresini girin</p>
      {% if error %}
      <div class="alert alert-danger py-2 small" role="alert"><i class="bi bi-exclamation-circle"></i> {{ error }}</div>
      {% endif %}
      <form method="post">
        <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
        <label class="form-label" for="password">Şifre</label>
        <div class="input-group mb-3">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" class="form-control" id="password" name="password" required autofocus autocomplete="current-password">
        </div>
        <button class="btn btn-primary w-100"><i class="bi bi-box-arrow-in-right"></i> Giriş yap</button>
      </form>
    </div>
  </div>
</main>
</body>
</html>
